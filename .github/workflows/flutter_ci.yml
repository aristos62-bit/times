name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('pubspec.lock') }}

      - run: flutter pub get

      - run: flutter pub run build_runner build --delete-conflicting-outputs

      # Stale generated check (01-10): το build δεν πρέπει να αλλάζει
      # committed `.g./.freezed` — αλλιώς η γεννήτρια έτρεξε με άλλο
      # κώδικα από τον committed (επαληθευμένο πράσινο τοπικά).
      - run: git diff --exit-code -- '*.g.dart' '*.freezed.dart'

      - run: flutter analyze

      - run: flutter test --coverage

      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: coverage/lcov.info